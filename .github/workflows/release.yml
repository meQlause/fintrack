# DOC-12, ADR-013: a v* tag builds the signed APK and AAB and attaches them to the GitHub Release
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          {
            echo "storeFile=$KEYSTORE_FILE"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
      - name: Build the signed APK and AAB
        run: ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "fintrack-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "fintrack-${GITHUB_REF_NAME}.aab"
          gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "fintrack-${GITHUB_REF_NAME}.apk" "fintrack-${GITHUB_REF_NAME}.aab"
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" keystore.properties

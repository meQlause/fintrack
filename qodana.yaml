# DOC-12: Qodana gates unused symbols only (05 section 4); pinned image needs AGP 9.4 (ADR-021)
version: "1.0"
linter: jetbrains/qodana-jvm-android:2026.3
projectJDK: 21
# DOC-12: the image ships only android-33; without compileSdk 37.2 the IDE cannot index the modules and
# reports tests and @Preview functions as unused
bootstrap: yes | /opt/android-sdk/cmdline-tools/tools/bin/sdkmanager --sdk_root=/opt/android-sdk "platforms;android-37.2" "build-tools;37.0.0" > /dev/null
profile:
  name: empty
include:
  - name: UnusedSymbol
exclude:
  - name: All
    paths:
      # Convention plugins are referenced by class-name strings in gradlePlugin {}, which Qodana cannot see
      - build-logic
failThreshold: 0
